<svg xmlns="http://w3.org" viewBox="0 0 600 260" preserveAspectRatio="xMidYMax slice">
    <style>
        .road-markings-group {
            animation: roadScrollLoop 1.6s linear infinite;
            will-change: transform;
        }
        @keyframes roadScrollLoop {
            0% { transform: translate3d(0, 0, 0); }
            100% { transform: translate3d(-64px, 0, 0); }
        }
        .truck-rig-group {
            animation: truckCruiseDrift 9s ease-in-out infinite;
            will-change: transform;
        }
        @keyframes truckCruiseDrift {
            0%, 100% { transform: translate3d(-18px, 0, 0); }
            50% { transform: translate3d(22px, 0, 0); }
        }
        .truck-chassis-bounce {
            animation: chassisSuspension 1.4s ease-in-out infinite;
            will-change: transform;
        }
        @keyframes chassisSuspension {
            0%, 100% { transform: translate3d(0, 0, 0); }
            50% { transform: translate3d(0, -0.8px, 0); }
        }
        .highway-lights-group {
            animation: highwayLightsLoop 6s linear infinite;
            will-change: transform;
        }
        @keyframes highwayLightsLoop {
            0% { transform: translate3d(0, 0, 0); }
            100% { transform: translate3d(-180px, 0, 0); }
        }
    </style>
    <defs>
        <!-- Полотно трассы -->

                        <!-- Полотно трассы -->
                        <linearGradient id="roadSurface" x1="0%" y1="0%" x2="0%" y2="100%">
                            <stop offset="0%" stop-color="#141923" stop-opacity="0.3" />
                            <stop offset="30%" stop-color="#171d29" stop-opacity="0.96" />
                            <stop offset="100%" stop-color="#0a0d12" stop-opacity="1" />
                        </linearGradient>

                        <!-- Луч матричных LED-фар -->
                        <linearGradient id="headlightCone" x1="0%" y1="50%" x2="100%" y2="50%">
                            <stop offset="0%" stop-color="#ffffff" stop-opacity="0.45" />
                            <stop offset="30%" stop-color="#e2e8f0" stop-opacity="0.16" />
                            <stop offset="100%" stop-color="#e2e8f0" stop-opacity="0" />
                        </linearGradient>

                        <!-- Белый полуприцеп -->
                        <linearGradient id="trailerWhite" x1="0%" y1="0%" x2="0%" y2="100%">
                            <stop offset="0%" stop-color="#ffffff" />
                            <stop offset="18%" stop-color="#f1f5f9" />
                            <stop offset="75%" stop-color="#cbd5e1" />
                            <stop offset="100%" stop-color="#94a3b8" />
                        </linearGradient>

                        <!-- Красная кабина тягача -->
                        <linearGradient id="cabRed" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" stop-color="#ef4444" />
                            <stop offset="45%" stop-color="#dc2626" />
                            <stop offset="100%" stop-color="#7f1d1d" />
                        </linearGradient>

                        <!-- Красный спойлер -->
                        <linearGradient id="spoilerRed" x1="0%" y1="0%" x2="0%" y2="100%">
                            <stop offset="0%" stop-color="#dc2626" />
                            <stop offset="100%" stop-color="#991b1b" />
                        </linearGradient>

                        <!-- Хром для выхлопной трубы -->
                        <linearGradient id="chromeMetal" x1="0%" y1="0%" x2="0%" y2="100%">
                            <stop offset="0%" stop-color="#cbd5e1" />
                            <stop offset="50%" stop-color="#64748b" />
                            <stop offset="100%" stop-color="#334155" />
                        </linearGradient>

                        <!-- Плавное растворение по краям -->
                        <linearGradient id="edgeFadeMask" x1="0%" y1="0%" x2="100%" y2="0%">
                            <stop offset="0%" stop-color="black" />
                            <stop offset="8%" stop-color="white" />
                            <stop offset="92%" stop-color="white" />
                            <stop offset="100%" stop-color="black" />
                        </linearGradient>
                        <mask id="sceneHorizontalMask">
                            <rect x="0" y="0" width="600" height="260" fill="url(#edgeFadeMask)" />
                        </mask>
                    </defs>

                    <g mask="url(#sceneHorizontalMask)">
                        <!-- Многослойный ночной рельеф -->
                        <path d="M0 166 Q 110 144, 210 160 T 420 150 T 600 164 L 600 260 L 0 260 Z" fill="#111622" opacity="0.75" />
                        <path d="M0 175 Q 150 162, 290 173 T 600 168 L 600 260 L 0 260 Z" fill="#161c28" opacity="0.9" />

                        <!-- Проплывающие мачты освещения вдоль магистрали -->
                        <g class="highway-lights-group">
                            <g transform="translate(80, 146)">
                                <line x1="0" y1="0" x2="0" y2="36" stroke="rgba(255,255,255,0.12)" stroke-width="1" />
                                <path d="M 0 0 L 7 0" stroke="rgba(255,255,255,0.28)" stroke-width="1.2" />
                                <ellipse cx="6" cy="2" rx="8" ry="2.5" fill="#ffffff" opacity="0.22" />
                            </g>
                            <g transform="translate(260, 146)">
                                <line x1="0" y1="0" x2="0" y2="36" stroke="rgba(255,255,255,0.12)" stroke-width="1" />
                                <path d="M 0 0 L 7 0" stroke="rgba(255,255,255,0.28)" stroke-width="1.2" />
                                <ellipse cx="6" cy="2" rx="8" ry="2.5" fill="#ffffff" opacity="0.22" />
                            </g>
                            <g transform="translate(440, 146)">
                                <line x1="0" y1="0" x2="0" y2="36" stroke="rgba(255,255,255,0.12)" stroke-width="1" />
                                <path d="M 0 0 L 7 0" stroke="rgba(255,255,255,0.28)" stroke-width="1.2" />
                                <ellipse cx="6" cy="2" rx="8" ry="2.5" fill="#ffffff" opacity="0.22" />
                            </g>
                            <g transform="translate(620, 146)">
                                <line x1="0" y1="0" x2="0" y2="36" stroke="rgba(255,255,255,0.12)" stroke-width="1" />
                                <path d="M 0 0 L 7 0" stroke="rgba(255,255,255,0.28)" stroke-width="1.2" />
                                <ellipse cx="6" cy="2" rx="8" ry="2.5" fill="#ffffff" opacity="0.22" />
                            </g>
                        </g>

                        <!-- Ночная многополосная магистраль -->
                        <rect x="0" y="182" width="600" height="78" fill="url(#roadSurface)" />
                        <line x1="0" y1="181.5" x2="600" y2="181.5" stroke="rgba(255,255,255,0.24)" stroke-width="1.2" />
                        <line x1="0" y1="184" x2="600" y2="184" stroke="rgba(255,255,255,0.08)" stroke-width="1" />

                        <!-- Бегущая разметка -->
                        <g class="road-markings-group">
                            <line x1="-120" y1="215" x2="780" y2="215" stroke="rgba(255,255,255,0.28)" stroke-width="1.8" stroke-dasharray="28 36" />
                            <line x1="-120" y1="244" x2="780" y2="244" stroke="rgba(255,255,255,0.11)" stroke-width="1.2" stroke-dasharray="20 44" />
                        </g>

                        <!-- МАГИСТРАЛЬНЫЙ АВТОПОЕЗД (КРАСНЫЙ ТЯГАЧ + БЕЛЫЙ ПРИЦЕП) -->
                        <g class="truck-rig-group">
                            <!-- Плотная тень под шасси -->
                            <ellipse cx="274" cy="209" rx="90" ry="5" fill="#030508" opacity="0.95" />

                            <!-- Свет LED-фар -->
                            <polygon points="356,195 535,172 535,214 356,202" fill="url(#headlightCone)" />
                            <polygon points="356,198 460,192 460,209 356,203" fill="url(#headlightCone)" opacity="0.9" />

                            <!-- Подвеска и кузов -->
                            <g class="truck-chassis-bounce">
                                <!-- 1. БЕЛЫЙ ПОЛУПРИЦЕП -->
                                <rect x="188" y="164" width="120" height="35" rx="2" fill="url(#trailerWhite)" stroke="rgba(255,255,255,0.6)" stroke-width="0.7" />
                                <!-- Верхний и нижний профили рамы прицепа -->
                                <rect x="188" y="164" width="120" height="2.2" rx="1" fill="#ffffff" />
                                <rect x="188" y="196.5" width="120" height="2.5" fill="#1e293b" />
                                <!-- Контурная полоса еврофуры -->
                                <line x1="191" y1="195.6" x2="305" y2="195.6" stroke="#64748b" stroke-width="0.8" stroke-dasharray="6 2" />

                                <!-- Рефрижератор на передней стенке прицепа -->
                                <rect x="307.5" y="166.5" width="3.5" height="14" rx="1" fill="#e2e8f0" stroke="#94a3b8" stroke-width="0.5" />
                                <line x1="308.5" y1="169" x2="310" y2="169" stroke="#334155" stroke-width="0.8" />
                                <line x1="308.5" y1="172" x2="310" y2="172" stroke="#334155" stroke-width="0.8" />
                                <line x1="308.5" y1="175" x2="310" y2="175" stroke="#334155" stroke-width="0.8" />

                                <!-- Тонкие вертикальные рёбра жёсткости на белом борту -->
                                <g stroke="rgba(15, 23, 42, 0.14)" stroke-width="0.8">
                                    <line x1="192" y1="167" x2="192" y2="195" />
                                    <line x1="208" y1="167" x2="208" y2="195" />
                                    <line x1="224" y1="167" x2="224" y2="195" />
                                    <line x1="240" y1="167" x2="240" y2="195" />
                                    <line x1="256" y1="167" x2="256" y2="195" />
                                    <line x1="272" y1="167" x2="272" y2="195" />
                                    <line x1="288" y1="167" x2="288" y2="195" />
                                    <line x1="303" y1="167" x2="303" y2="195" />
                                </g>

                                <!-- Паллетный ящик и боковая защита -->
                                <rect x="234" y="199" width="46" height="5" rx="1" fill="#1e293b" stroke="rgba(255,255,255,0.18)" stroke-width="0.5" />

                                <!-- Сцепка, рама и вертикальная выхлопная труба за кабиной -->
                                <rect x="307" y="196" width="14" height="4" fill="#0f172a" />
                                <rect x="312.2" y="159" width="1.8" height="36" rx="0.8" fill="url(#chromeMetal)" />

                                <!-- 2. КРАСНАЯ КАБИНА ТЯГАЧА (без бака между колёсами) -->
                                <path d="M 315 199 L 315 168 Q 315 164 319 164 L 343 164 Q 350 164 353 173 L 357 188 L 357 199 Z"
                                      fill="url(#cabRed)" stroke="rgba(255,255,255,0.28)" stroke-width="0.8" />
                                <!-- Верхний красный аэродинамический спойлер -->
                                <path d="M 315 164 L 339 164 Q 328 158.5 315 158.5 Z" fill="url(#spoilerRed)" stroke="rgba(255,255,255,0.25)" stroke-width="0.6" />
                                <!-- Солнцезащитный козырёк над лобовым стеклом -->
                                <path d="M 343 165 L 350 167 L 348 169 L 343 167 Z" fill="#1e293b" />
                                <circle cx="347" cy="166.5" r="0.8" fill="#ffffff" />

                                <!-- Остекление кабины и стойка двери -->
                                <path d="M 332 169 L 347 169 L 351.5 182 L 332 182 Z" fill="#090d16" stroke="rgba(255,255,255,0.25)" stroke-width="0.6" />
                                <line x1="341" y1="169" x2="341" y2="182" stroke="#991b1b" stroke-width="1.2" />
                                <!-- Блики на стёклах -->
                                <line x1="335" y1="171" x2="339" y2="180" stroke="rgba(255,255,255,0.22)" stroke-width="1" />
                                <line x1="344" y1="171" x2="348" y2="180" stroke="rgba(255,255,255,0.25)" stroke-width="1" />

                                <!-- Расшивка двери и ручка -->
                                <path d="M 330 168 L 330 194 L 345 194" fill="none" stroke="rgba(0,0,0,0.35)" stroke-width="0.7" />
                                <rect x="332" y="186" width="3" height="1" rx="0.5" fill="#1e293b" />

                                <!-- Боковой профиль передней решётки радиатора -->
                                <g stroke="#1e293b" stroke-width="0.8">
                                    <line x1="352.5" y1="185" x2="356.2" y2="185" />
                                    <line x1="353" y1="187.5" x2="356.5" y2="187.5" />
                                    <line x1="353.5" y1="190" x2="356.8" y2="190" />
                                    <line x1="354" y1="192.5" x2="356.8" y2="192.5" />
                                </g>

                                <!-- Матричная LED-фара и противотуманка -->
                                <rect x="354.5" y="194.5" width="2.5" height="3.8" rx="0.8" fill="#ffffff" />
                                <circle cx="355.5" cy="199.5" r="0.9" fill="#e2e8f0" />

                                <!-- Брызговики -->
                                <rect x="193" y="199" width="1.5" height="7" fill="#0f172a" />
                                <rect x="309" y="199" width="1.5" height="7" fill="#0f172a" />
                            </g>

                            <!-- 3. ПОЛНОСТЬЮ ЧЁРНЫЕ КОЛЁСА (без серых колпаков) -->
                            <!-- Оси полуприцепа -->
                            <g transform="translate(199, 203.5)">
                                <circle r="5.2" fill="#090c10" stroke="#1e293b" stroke-width="1.2" />
                                <circle r="2.2" fill="#111622" />
                            </g>
                            <g transform="translate(211, 203.5)">
                                <circle r="5.2" fill="#090c10" stroke="#1e293b" stroke-width="1.2" />
                                <circle r="2.2" fill="#111622" />
                            </g>
                            <g transform="translate(223, 203.5)">
                                <circle r="5.2" fill="#090c10" stroke="#1e293b" stroke-width="1.2" />
                                <circle r="2.2" fill="#111622" />
                            </g>

                            <!-- Ведущая и рулевая оси тягача -->
                            <g transform="translate(316, 203.5)">
                                <circle r="5.4" fill="#090c10" stroke="#1e293b" stroke-width="1.2" />
                                <circle r="2.4" fill="#111622" />
                            </g>
                            <g transform="translate(348, 203.5)">
                                <circle r="5.4" fill="#090c10" stroke="#1e293b" stroke-width="1.2" />
                                <circle r="2.4" fill="#111622" />
                            </g>
                        </g>
                    </g>
                </svg>
