<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="TenderPilot — ИИ-анализ тендеров и автоматизация госзакупок">
    <title>TenderPilot — ИИ-анализ тендеров</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            min-height: 100vh;
            overflow-x: hidden;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;

            /* Ночь внизу → холодный рассвет сверху */
            background:
                radial-gradient(
                    ellipse 90% 42% at 50% 100%,
                    rgba(31, 78, 120, 0.34) 0%,
                    rgba(16, 42, 70, 0.22) 38%,
                    transparent 75%
                ),
                linear-gradient(
                    180deg,
                    #a5b5c0 0%,
                    #60798d 13%,
                    #2b4863 29%,
                    #14283f 49%,
                    #091321 70%,
                    #03060c 87%,
                    #010204 100%
                );

            background-attachment: fixed;
            background-repeat: no-repeat;
            background-size: cover;
            -webkit-font-smoothing: antialiased;
        }

        /* Звёзды: ярче внизу, постепенно исчезают к рассвету */
        body::before {
            content: "";
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;

            background-image:
                radial-gradient(1.5px 1.5px at 8% 18%, rgba(255,255,255,0.95), transparent 70%),
                radial-gradient(1px 1px at 16% 34%, rgba(210,235,255,0.85), transparent 70%),
                radial-gradient(1px 1px at 25% 12%, rgba(255,255,255,0.8), transparent 70%),
                radial-gradient(2px 2px at 34% 43%, rgba(180,225,255,0.9), transparent 70%),
                radial-gradient(1px 1px at 46% 22%, rgba(255,255,255,0.75), transparent 70%),
                radial-gradient(1.5px 1.5px at 58% 38%, rgba(195,225,255,0.75), transparent 70%),
                radial-gradient(1px 1px at 69% 16%, rgba(255,255,255,0.7), transparent 70%),
                radial-gradient(2px 2px at 79% 31%, rgba(180,220,255,0.8), transparent 70%),
                radial-gradient(1px 1px at 89% 12%, rgba(255,255,255,0.6), transparent 70%),
                radial-gradient(1px 1px at 94% 46%, rgba(190,225,255,0.55), transparent 70%),
                radial-gradient(1px 1px at 12% 67%, rgba(255,255,255,0.75), transparent 70%),
                radial-gradient(1.5px 1.5px at 28% 78%, rgba(210,240,255,0.85), transparent 70%),
                radial-gradient(1px 1px at 53% 69%, rgba(255,255,255,0.8), transparent 70%),
                radial-gradient(2px 2px at 72% 81%, rgba(190,230,255,0.9), transparent 70%),
                radial-gradient(1px 1px at 88% 72%, rgba(255,255,255,0.8), transparent 70%);

            opacity: 0.7;

            -webkit-mask-image: linear-gradient(
                to top,
                #000000 0%,
                rgba(0, 0, 0, 0.95) 27%,
                rgba(0, 0, 0, 0.62) 53%,
                rgba(0, 0, 0, 0.2) 75%,
                transparent 94%
            );

            mask-image: linear-gradient(
                to top,
                #000000 0%,
                rgba(0, 0, 0, 0.95) 27%,
                rgba(0, 0, 0, 0.62) 53%,
                rgba(0, 0, 0, 0.2) 75%,
                transparent 94%
            );
        }

        /* Мягкая дымка и свечение рассвета */
        body::after {
            content: "";
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;

            background:
                radial-gradient(
                    ellipse 70% 24% at 50% 18%,
                    rgba(190, 211, 224, 0.18),
                    rgba(105, 139, 163, 0.08) 42%,
                    transparent 76%
                ),
                radial-gradient(
                    ellipse 58% 30% at 50% 63%,
                    rgba(16, 69, 112, 0.2),
                    transparent 76%
                );

            opacity: 0.9;
        }

        a {
            color: inherit;
        }

        .container {
            position: relative;
            z-index: 1;
            width: min(1200px, calc(100% - 40px));
            margin: 0 auto;
        }

        header {
            position: relative;
            z-index: 10;
            display: flex;
            align-items: center;
            justify-content: space-between;
            min-height: 80px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }

        .logo {
            color: #ffffff;
            text-decoration: none;
            font-size: 22px;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .logo span {
            color: #00f2fe;
        }

        nav {
            display: flex;
            align-items: center;
            gap: 28px;
        }

        nav a {
            color: #8a8a93;
            text-decoration: none;
            font-size: 14px;
            transition: color 0.2s ease;
        }

        nav a:hover {
            color: #ffffff;
        }

        .lk-btn {
            display: inline-block;
            padding: 12px 24px;
            border: 0;
            border-radius: 50px;
            color: #0b0b0f;
            background: #ffffff;
            font-weight: 600;
            text-decoration: none;
            cursor: pointer;
            transition: transform 0.2s ease;
        }

        .lk-btn:hover {
            transform: scale(1.04);
        }

        .menu-toggle {
            display: none;
            width: 44px;
            height: 44px;
            align-items: center;
            justify-content: center;
            border: 1px solid #343442;
            border-radius: 12px;
            color: #ffffff;
            background: rgba(255, 255, 255, 0.04);
            font-size: 24px;
            cursor: pointer;
        }

        .hero {
            max-width: 850px;
            margin: 0 auto;
            padding: 90px 0 70px;
            text-align: center;
        }

        .hero h1 {
            margin-bottom: 24px;
            font-size: clamp(32px, 5vw, 52px);
            line-height: 1.15;
            font-weight: 800;
        }

        .gradient-text {
            background: linear-gradient(135deg, #00f2fe, #4facfe);
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .hero p {
            color: #a1a1aa;
            font-size: 18px;
            line-height: 1.6;
        }

        .hero-actions {
            display: flex;
            justify-content: center;
            gap: 14px;
            margin-top: 32px;
            flex-wrap: wrap;
        }

        .primary-btn,
        .secondary-btn {
            display: inline-block;
            padding: 15px 25px;
            border-radius: 12px;
            font-weight: 600;
            text-decoration: none;
            cursor: pointer;
            transition: transform 0.2s ease, border-color 0.2s ease;
        }

        .primary-btn {
            color: #0b0b0f;
            background: #ffffff;
        }

        .secondary-btn {
            border: 1px solid #343442;
            color: #ffffff;
            background: rgba(255, 255, 255, 0.04);
        }

        .primary-btn:hover,
        .secondary-btn:hover {
            transform: translateY(-2px);
        }

        .bento-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 24px;
            margin-bottom: 100px;
        }

        .bento-item {
            min-height: 190px;
            padding: 30px;
            border: 1px solid #292936;
            border-radius: 24px;
            background: rgba(18, 18, 26, 0.78);
            transition: transform 0.3s ease, border-color 0.3s ease;
        }

        .bento-item:hover {
            border-color: #00f2fe;
            transform: translateY(-5px);
        }

        .icon {
            display: block;
            margin-bottom: 18px;
            font-size: 30px;
        }

        .bento-item h3 {
            margin-bottom: 12px;
            font-size: 19px;
        }

        .bento-item p {
            color: #8a8a93;
            font-size: 14px;
            line-height: 1.6;
        }

        .about {
            padding: 70px 0;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            text-align: center;
        }

        .about h2 {
            margin-bottom: 18px;
            font-size: 30px;
        }

        .about p {
            max-width: 680px;
            margin: 0 auto;
            color: #8a8a93;
            line-height: 1.7;
        }

        footer {
            padding: 40px 0;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            color: #666675;
            font-size: 13px;
            text-align: center;
        }

        @media (max-width: 768px) {
            .container {
                width: min(100% - 28px, 1200px);
            }

            header {
                min-height: 70px;
            }

            .menu-toggle {
                display: flex;
            }

            nav {
                position: absolute;
                top: 80px;
                left: 0;
                right: 0;
                display: none;
                flex-direction: column;
                align-items: stretch;
                gap: 16px;
                padding: 22px;
                border: 1px solid #292936;
                border-radius: 16px;
                background: #0c0c14;
                box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
            }

            nav.open {
                display: flex;
            }

            nav a {
                padding: 5px 0;
                text-align: center;
            }
