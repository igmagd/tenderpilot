<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TenderPilot — ИИ-анализ тендеров, калькулятор НМЦК, автоматизация госзакупок по 44-ФЗ и 223-ФЗ</title>
    <style>
        /* ПРЕМИАЛЬНЫЙ КИБЕРПАНК С ПРЕДРАССВЕТНЫМ ГРАДИЕНТОМ */
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body { 
            background: linear-gradient(180deg, #1A0B12 0%, #0C0C14 25%, #0B0B0F 60%, #0B0B0F 100%);
            background-attachment: fixed;
            color: #FFFFFF; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
            position: relative;
        }

        /* МЕРЦАЮЩЕЕ ЗВЕЗДНОЕ НЕБО С ПАРАЛЛАКСОМ */
        body::before {
            content: ""; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-image: 
                radial-gradient(1px 1px at 10px 30px, #fff, rgba(0,0,0,0)),
                radial-gradient(1px 1px at 50px 100px, #fff, rgba(0,0,0,0)),
                radial-gradient(1.5px 1.5px at 120px 40px, rgba(0, 242, 254, 0.6), rgba(0,0,0,0)),
                radial-gradient(1px 1px at 200px 150px, #fff, rgba(0,0,0,0)),
                radial-gradient(2px 2px at 300px 80px, rgba(255, 255, 255, 0.8), rgba(0,0,0,0));
            background-size: 350px 350px; opacity: 0.25; z-index: 0; pointer-events: none;
        }

        .container { max-width: 1200px; margin: 0 auto; padding: 0 24px; width: 100%; display: flex; flex-direction: column; }

        /* ВЕРХНЕЕ МЕНЮ APPLE СТИЛЬ */
        header { display: flex; justify-content: space-between; align-items: center; padding: 24px 0; border-bottom: 1px solid rgba(255,255,255,0.05); width: 100%; position: relative; z-index: 1002; }
        .logo { font-size: 22px; font-weight: 700; color: #FFF; letter-spacing: -0.5px; cursor: pointer; }
        .logo span { color: #00F2FE; }
        
        nav { display: flex; gap: 28px; align-items: center; }
        nav a { color: #8A8A93; text-decoration: none; font-size: 14px; font-weight: 500; transition: color 0.2s; }
        nav a:hover { color: #FFF; }
        
        .lk-btn {
            background: #FFFFFF; color: #0B0B0F; padding: 12px 24px; border-radius: 50px; 
            font-weight: 600; box-shadow: 0 0 15px rgba(255,255,255,0.3); cursor: pointer; transition: transform 0.2s; border: none; outline: none;
        }
        .lk-btn:hover { transform: scale(1.05); }

        /* СТРУКТУРНЫЕ ЭКРАНЫ */
        #landing-page { display: block; width: 100%; }
        #lk-content { display: none; padding-top: 40px; width: 100%; }

        /* ЦАРЬ-ПЛАШКА */
        .hero { text-align: center; padding: 80px 0 60px 0; max-width: 850px; margin: 0 auto; width: 100%; }
        .hero h1 { font-size: 54px; font-weight: 800; letter-spacing: -1.5px; line-height: 1.15; margin-bottom: 24px; }
        .hero h1 span { background: linear-gradient(135deg, #00F2FE, #4FACFE); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .hero h2 { font-size: 19px; color: #8A8A93; font-weight: 400; line-height: 1.6; }

        /* БЕНТО-СЕТКА В ПРЕМИАЛЬНОМ КИБЕРПАНКЕ */
        .bento-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px; margin: 40px 0 100px 0; width: 100%; }
        .bento-item {
            background: rgba(18, 18, 26, 0.6); backdrop-filter: blur(10px); border: 1px solid #232330; 
            border-radius: 24px; padding: 32px; cursor: pointer; transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            position: relative; overflow: hidden;
        }
        .bento-item:hover { transform: translateY(-4px); border-color: #00F2FE; box-shadow: 0 10px 30px rgba(0, 242, 254, 0.05); }
        .bento-item h3 { font-size: 19px; margin-bottom: 12px; font-weight: 600; display: flex; align-items: center; gap: 10px; }
        .bento-item p { color: #8A8A93; font-size: 14px; line-height: 1.5; }

        /* ПАСХАЛКА №1: КРИЧАЩИЙ КЛЕРК В ФОРМУЛАХ */
        .screaming-klerk-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: #0B0B0F; border-radius: 22px; display: none;
            flex-direction: column; justify-content: center; align-items: center; padding: 20px; z-index: 5;
        }
        .screaming-text { color: #FF4A4A; font-weight: bold; font-size: 28px; animation: shake 0.1s infinite; text-align: center; }
        .formulas-bg { font-size: 11px; color: rgba(255,74,74,0.3); font-family: monospace; text-align: center; margin-top: 5px; line-height: 1.3; }

        /* РАСКРЫВАЮЩЕЕСЯ БЕНТО-ОКНО */
        .bento-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(11, 11, 15, 0.9); backdrop-filter: blur(15px);
            z-index: 5000; display: none; justify-content: center; align-items: center; padding: 20px;
        }
        .expanded-card { background: #12121A; border: 2px solid #00F2FE; width: 100%; max-width: 750px; max-height: 85vh; border-radius: 32px; padding: 48px; position: relative; overflow-y: auto; box-shadow: 0 0 50px rgba(0, 242, 254, 0.15); }
        .close-btn { position: absolute; top: 24px; right: 24px; background: none; border: none; color: #8A8A93; font-size: 28px; cursor: pointer; }
        .close-btn:hover { color: #FFF; }
        
        /* КАСКАД ИКОНОК GOOGLE WORKSPACE */
        .export-cascade { display: flex; gap: 15px; margin-top: 15px; }
        .export-icon {
            padding: 12px 20px; border-radius: 10px; font-size: 14px; font-weight: 600;
            cursor: pointer; transition: all 0.3s; background: #0B0B0F; border: 1px solid #232330;
            display: flex; align-items: center; gap: 8px;
        }
        .export-icon.excel:hover { border-color: #217346; color: #217346; box-shadow: 0 0 15px rgba(33,115,70,0.3); }
        .export-icon.word:hover { border-color: #2b579a; color: #2b579a; box-shadow: 0 0 15px rgba(43,87,154,0.3); }
        .export-icon.pdf:hover { border-color: #f40f02; color: #f40f02; box-shadow: 0 0 15px rgba(244,15,2,0.3); }
        
        .expanded-cta-btn { display: inline-block; margin-top: 32px; background: #FFFFFF; color: #0B0B0F; padding: 16px 32px; border-radius: 12px; font-weight: 600; border: none; cursor: pointer; }

        /* ПАСХАЛКА №2: ВСПЫШКА ЗАСАДЫ ПЕРЕД ОПЛАТОЙ */
        .zaprodlo-flash {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: #000;
            z-index: 10; display: none; align-items: center; justify-content: center; border-radius: 30px;
        }

        .tech-section { text-align: center; padding: 60px 0; border-top: 1px solid rgba(255,255,255,0.05); width: 100%; }
        .tech-grid { display: flex; justify-content: center; gap: 48px; color: #8A8A93; font-size: 14px; margin-top: 24px; }
        footer { padding: 40px 0; text-align: center; color: #323247; font-size: 12px; border-top: 1px solid rgba(255,255,255,0.05); width: 100%; }

        /* ИНТЕРФЕЙС ЛИЧНОГО КАБИНЕТА */
        .lk-dashboard { display: grid; grid-template-columns: 280px 1fr; gap: 32px; margin-bottom: 60px; width: 100%; }
        .lk-sidebar { background: rgba(18, 18, 26, 0.6); border: 1px solid #232330; border-radius: 24px; padding: 24px; display: flex; flex-direction: column; gap: 16px; }
        .sidebar-item { padding: 14px 20px; border-radius: 12px; color: #8A8A93; font-size: 15px; cursor: pointer; transition: all 0.2s; }
        .sidebar-item:hover, .sidebar-item.active { background: #232330; color: #FFF; font-weight: 600; }
        .sidebar-item.active { border-left: 3px solid #00F2FE; }
        .lk-main { background: rgba(18, 18, 26, 0.4); border: 1px solid #232330; border-radius: 24px; padding: 40px; }
        
        .stat-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-bottom: 32px; width: 100%; }
        .stat-card { background: #12121A; border: 1px solid #232330; border-radius: 16px; padding: 24px; }
        .stat-card h5 { color: #8A8A93; font-size: 13px; font-weight: 500; margin-bottom: 8px; }
        .stat-card div { font-size: 24px; font-weight: 700; color: #00F2FE; }

        @keyframes shake { 0% { transform: translate(1px, 1px) rotate(0deg); } 10% { transform: translate(-1px, -2px) rotate(-1deg); } 30% { transform: translate(3px, 2px) rotate(0deg); } 50% { transform: translate(-1px, 2px) rotate(1deg); } 100% { transform: translate(1px, -2px) rotate(0deg); } }
        @keyframes fadeInUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* ЖЕСТКИЙ АДАПТИВ ДЛЯ МОБИЛЬНЫХ ТЕЛЕФОНОВ */
        @media (max-width: 968px) {
            header { flex-direction: column; gap: 16px; text-align: center; padding: 20px 0; }
            .hero { padding: 40px 0 20px 0; }
            .hero h1 { font-size: 32px; line-height: 1.25; margin-bottom: 16px; }
            .hero h2 { font-size: 15px; line-height: 1.5; }
            .bento-grid { grid-template-columns: 1fr; gap: 20px; margin-top: 20px; }
            .lk-dashboard, .stat-row, .export-cascade { grid-template-columns: 1fr; }
            .expanded-card { padding: 24px; width: 95%; }
            .tech-grid { flex-direction: column; gap: 16px; }
            .lk-main { padding: 24px; }
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <div class="logo" onclick="goToLanding()">Tender<span>Pilot</span></div>
            <button class="lk-btn" id="lk-toggle-btn" onclick="toggleLK()">[👤 Личный кабинет]</button>
        </header>

        <!-- ЛЕНДИНГ -->
        <div id="landing-page">
            <section class="hero">
                <h1>ИИ-анализ тендеров, калькулятор НМЦК и <span>замена раздутого штата</span></h1>
