<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TenderPilot — ИИ-анализ тендеров ЕИС и b2b-автоматизация</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            background-color: #0B0B0F; /* Тот самый премиальный глубокий черный */
            color: #ffffff;
            -webkit-font-smoothing: antialiased;
            overflow-x: hidden;
        }

        /* Шапка сайта в стиле Apple */
        header {
            background-color: rgba(11, 11, 15, 0.8);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            padding: 20px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .logo {
            font-size: 22px;
            font-weight: 800;
            color: #ffffff;
            text-decoration: none;
            letter-spacing: -0.5px;
        }

        nav {
            display: flex;
            gap: 35px;
        }

        nav a {
            color: rgba(255, 255, 255, 0.6);
            text-decoration: none;
            font-weight: 500;
            font-size: 15px;
            transition: color 0.2s ease;
        }

        nav a:hover {
            color: #ffffff;
        }

        /* Кнопка ЛК — Яркий белый маяк со скруглением Apple и иконкой */
        .btn-lk {
            background-color: #ffffff;
            color: #0B0B0F;
            padding: 10px 22px;
            border-radius: 20px; /* Скругление суперэллипс */
            text-decoration: none;
            font-weight: 600;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: opacity 0.2s ease;
        }

        .btn-lk:hover {
            opacity: 0.9;
        }

        /* Затемняющая подложка для эффекта Живого Bento */
        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(4px);
            z-index: 500;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        body.has-active-box .overlay {
            opacity: 1;
        }

        /* Главный контейнер сайта */
        main {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
            position: relative;
        }

        /* Царь-плашка (70% экрана) — Наш главный фокус */
        .hero-card {
            background-color: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 24px; /* Скругление Apple */
            padding: 60px 40px;
            margin: 80px auto;
            max-width: 900px; /* Приблизительно 70% от ширины контента */
            text-align: center;
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.5);
        }

        h1 {
            font-size: 44px;
            font-weight: 800;
            line-height: 1.2;
            letter-spacing: -1px;
            margin-bottom: 25px;
            background: linear-gradient(180deg, #ffffff 0%, rgba(255, 255, 255, 0.7) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .subtitle {
            font-size: 18px;
            color: rgba(255, 255, 255, 0.6);
            line-height: 1.6;
            text-align: center;
        }

        /* Заголовок для Bento-сетки */
        .section-title {
            font-size: 32px;
            font-weight: 800;
            margin-bottom: 40px;
            letter-spacing: -0.5px;
        }

        /* Асимметричная Bento-сетка 3х2 */
        .bento-grid {
            display: grid;
            grid-template-columns: 1.4fr 1fr 1.2fr;
            grid-auto-rows: 240px;
            gap: 24px;
            margin-bottom: 100px;
            position: relative;
        }

        /* Индивидуальное распределение размеров для асимметрии */
        .bento-box:nth-child(1) { grid-column: span 1; background: linear-gradient(135deg, rgba(26, 36, 73, 0.4) 0%, rgba(11, 11, 15, 0.9) 100%); --glow: rgba(43, 76, 219, 0.3); }
        .bento-box:nth-child(2) { grid-column: span 2; background: linear-gradient(135deg, rgba(20, 52, 70, 0.4) 0%, rgba(11, 11, 15, 0.9) 100%); --glow: rgba(31, 126, 177, 0.3); }
        .bento-box:nth-child(3) { grid-column: span 2; background: linear-gradient(135deg, rgba(58, 38, 77, 0.4) 0%, rgba(11, 11, 15, 0.9) 100%); --glow: rgba(121, 64, 185, 0.3); }
        .bento-box:nth-child(4) { grid-column: span 1; background: linear-gradient(135deg, rgba(17, 53, 38, 0.4) 0%, rgba(11, 11, 15, 0.9) 100%); --glow: rgba(34, 139, 94, 0.3); }
        .bento-box:nth-child(5) { grid-column: span 1; background: linear-gradient(135deg, rgba(73, 56, 30, 0.4) 0%, rgba(11, 11, 15, 0.9) 100%); --glow: rgba(185, 132, 47, 0.3); }
        .bento-box:nth-child(6) { grid-column: span 2; background: linear-gradient(135deg, rgba(46, 50, 56, 0.4) 0%, rgba(11, 11, 15, 0.9) 100%); --glow: rgba(100, 110, 120, 0.3); }

        /* Базовая плашка со скруглением Apple/Samsung */
        .bento-box {
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 24px;
            padding: 35px;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            position: relative;
            cursor: pointer;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
            transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1), 
                        border-color 0.4s ease, 
                        box-shadow 0.4s ease;
        }

        .bento-box h3 {
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 12px;
            color: #ffffff;
            transition: font-size 0.4s ease;
        }

        .bento-box p {
            color: rgba(255, 255, 255, 0.5);
            font-size: 15px;
            line-height: 1.5;
            transition: opacity 0.3s ease, color 0.4s ease;
        }

        /* Скрытый глубокий текст, проявляющийся при раскрытии */
        .bento-box .deep-text {
            display: none;
            opacity: 0;
            color: rgba(255, 255, 255, 0.85);
            font-size: 17px;
            line-height: 1.6;
            margin-top: 20px;
            transition: opacity 0.4s ease 0.2s;
        }

        /* ЭФФЕКТ ЖИВОГО БЕНТО: Раскрытие ровно на 60% экрана по центру */
        .bento-box.active {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(1) !important;
            width: 60vw; /* Ровно 60% экрана */
            height: auto;
            max-height: 80vh;
            grid-column: auto !important;
            grid-row: auto !important;
            z-index: 1000;
            background: #111116 !important;
            border-color: rgba(255, 255, 255, 0.2);
            box-shadow: 0 20px 50px var(--glow); /* Неоновое космическое свечение */
            justify-content: center;
            cursor: default;
        }

        .bento-box.active h3 {
            font-size: 32px;
            margin-bottom: 15px;
        }

        .bento-box.active p {
            display: none; /* Прячем короткое превью */
        }

        .bento-box.active .deep-text {
            display: block;
            opacity: 1;
        }

        /* Ховер-эффект легкого приподнимания для неактивных плашек */
        body:not(.has-active-box) .bento-box:hover {
            transform: translateY(-4px);
            border-color: rgba(255, 255, 255, 0.15);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
        }

        /* Секция Финала (Самый низ) */
        .final-section {
            text-align: center;
            margin-bottom: 120px;
        }

        .btn-main {
            background-color: #ffffff;
            color: #0B0B0F;
            padding: 18px 45px;
            border-radius: 30px; /* Плавное скругление Apple */
            text-decoration: none;
            font-size: 16px;
            font-weight: 700;
            display: inline-block;
            transition: opacity 0.2s ease;
        }

        .btn-main:hover {
            opacity: 0.95;
        }

        /* Строгий юридический подвал */
        footer {
            border-top: 1px solid rgba(255, 255, 255, 0.06);
            padding: 40px 0;
            margin-top: 60px;
            font-size: 14px;
            color: rgba(255, 255, 255, 0.4);
        }

        .footer-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
        }

        .footer-links {
            display: flex;
            gap: 25px;
        }

        .footer-links a {
            color: rgba(255, 255, 255, 0.4);
            text-decoration: none;
            transition: color 0.2s ease;
        }

        .footer-links a:hover {
            color: #ffffff;
        }

        /* Мобильная адаптация: перевод в одну чистую вертикальную ленту */
        @media (max-width: 900px) {
            header { padding: 15px 20px; }
            nav { display: none; }
            h1 { font-size: 32px; }
            .subtitle { font-size: 16px; }
            .hero-card { padding: 40px 20px; margin: 40px auto; }
            .bento-grid {
